# Astolfo Goth v2 — included from kitty.conf
# User's Kitty theme remains otherwise unchanged.
background #1a1b1f
background_image /home/franke/Dotfiles/kitty/astolfo-goth/astolfo-goth-split.png
background_image_layout scaled
background_image_linear yes
background_tint 0.0

# Subtle rose outline around the Kitty window (even with one pane).
draw_window_borders_for_single_window yes
window_border_width 2px
active_border_color #e985a1
inactive_border_color #805068

# Prevent clipped prompt and Fastfetch logo at window edge.
window_padding_width 12
single_window_padding_width 12
