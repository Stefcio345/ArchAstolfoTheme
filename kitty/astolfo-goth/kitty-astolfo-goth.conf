# Gothic corners v4 — included from kitty.conf
# User's Kitty theme remains otherwise unchanged.
background #1a1b1f
background_image astolfo-goth/gothic-corners-v4.png
# Preserve proportions when the terminal becomes tall or narrow.
background_image_layout cscaled
background_image_linear yes
background_tint 0.0
# Recompose the same artwork on resize, with four independently anchored corners.
watcher astolfo-goth/responsive_background.py

# The artwork supplies the decoration; avoid extra rose bars around the pane.
draw_window_borders_for_single_window no
window_border_width 0

# Prevent clipped prompt and Fastfetch logo at window edge.
window_padding_width 10
single_window_padding_width 10
